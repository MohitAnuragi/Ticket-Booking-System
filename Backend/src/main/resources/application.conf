ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.ticketbooking.ApplicationKt.module ]
    }
}

app {
    # ---------------------------------------------------------------------
    # Database (Supabase PostgreSQL).
    # Values come from the environment; there are no defaults, so a missing
    # setting is reported at startup instead of silently connecting somewhere
    # unexpected. See Backend/.env.example for how to set these on Windows.
    # ---------------------------------------------------------------------
    db {
        url = ${?DB_URL}
        user = ${?DB_USER}
        password = ${?DB_PASSWORD}
        poolSize = 5
        poolSize = ${?DB_POOL_SIZE}
    }

    # ---------------------------------------------------------------------
    # JWT signing. JWT_SECRET is required at startup.
    # ---------------------------------------------------------------------
    jwt {
        secret = ${?JWT_SECRET}
        issuer = "ticket-booking-system"
        issuer = ${?JWT_ISSUER}
        audience = "ticket-booking-users"
        audience = ${?JWT_AUDIENCE}
        realm = "Ticket Booking System"
        expiryHours = 24
        expiryHours = ${?JWT_EXPIRY_HOURS}
    }

    # ---------------------------------------------------------------------
    # Bootstrap admin: ensures an ADMIN account exists, since public
    # registration only ever creates USER accounts. Blank email disables it.
    # ---------------------------------------------------------------------
    admin {
        bootstrapEmail = ""
        bootstrapEmail = ${?ADMIN_BOOTSTRAP_EMAIL}
        bootstrapPassword = ""
        bootstrapPassword = ${?ADMIN_BOOTSTRAP_PASSWORD}
        bootstrapName = "Platform Admin"
        bootstrapName = ${?ADMIN_BOOTSTRAP_NAME}
    }

    # ---------------------------------------------------------------------
    # Seat holds. A hold marks seats LOCKED for ttlHours before they return
    # to AVAILABLE, both lazily on read and via the background sweeper.
    # ---------------------------------------------------------------------
    hold {
        ttlHours = 24
        ttlHours = ${?HOLD_TTL_HOURS}
        sweepIntervalMinutes = 5
        sweepIntervalMinutes = ${?HOLD_SWEEP_INTERVAL_MINUTES}
        maxSeatsPerBooking = 10
        maxSeatsPerBooking = ${?MAX_SEATS_PER_BOOKING}
    }

    # ---------------------------------------------------------------------
    # CORS: origins allowed to call this API from a browser.
    # "*" means any origin (development default). Override in production:
    #   CORS_ALLOWED_HOSTS="http://localhost:5500,https://myapp.example"
    # ---------------------------------------------------------------------
    cors {
        allowedHosts = ["*"]
        allowedHosts = ${?CORS_ALLOWED_HOSTS}
    }
}
